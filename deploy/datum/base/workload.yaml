apiVersion: compute.datumapis.com/v1alpha
kind: Workload
metadata:
  name: ronggur-my-id
spec:
  template:
    spec:
      runtime:
        resources:
          # The only valid instance type: 1 vCPU, 2 GiB (register row L1).
          # Per-container `resources` is rejected at admission.
          instanceType: datumcloud/d1-standard-2
        sandbox:
          containers:
            - name: web
              # Overwritten with an immutable digest by the production overlay.
              # Re-pushing a mutable tag rolls nothing (register row L52).
              image: ghcr.io/ronggur/ronggur-my-id:latest
              env:
                - name: PORT
                  value: "8080"
                - name: SITE_ROOT
                  value: /site
              ports:
                - name: http
                  port: 8080
                  protocol: TCP
      networkInterfaces:
        # ipFamilies omitted -> the platform defaults it to [IPv6] (see the
        # CRD's ipFamilies default). Staging has no IPv4 IPClass at all yet —
        # confirmed in infra/apps/network-services-operator/platform-project/
        # classes.yaml: "IPv6 is the only address family the platform hands
        # out. There is deliberately no IPv4 class here." So the instance
        # gets no EXTERNAL IP and no private IPv4 either, no matter what this
        # manifest asks for — that's a platform gap, not a config one.
        - network:
            name: default
          networkPolicy:
            ingress:
              - ports:
                  - port: 8080
                from:
                  # ::/0, not 0.0.0.0/0: the compute repo's own samples
                  # (workload-sandbox, workload-vm, multi-placement, kong-
                  # gateway) all still write the IPv4 form, which matches no
                  # traffic on an IPv6-only interface (IPBlock.CIDR accepts
                  # either family — see network-services-operator's
                  # networkpolicy_types.go). Keeping the IPv4 line too costs
                  # nothing and covers the day IPv4 ships.
                  - ipBlock:
                      cidr: "::/0"
                  - ipBlock:
                      cidr: 0.0.0.0/0
  placements:
    - name: us
      cityCodes:
        # Must be a code from `datumctl get locationbindings -o wide` for
        # whichever project is actually active — confirmed by admission
        # itself on 2026-08-25 against project website-w7zf79 (a different
        # project than personal-project-86e0525b, checked 2026-08-19).
        - DFW
      scaleSettings:
        # 1 replica means every rollout replaces the only instance and the
        # site is down for that window (register rows L21, L43). Raise to 2
        # before this carries traffic that matters.
        minReplicas: 1
