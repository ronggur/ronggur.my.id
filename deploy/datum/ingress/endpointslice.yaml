# The bridge from the Gateway to your instances. Nothing on the platform keeps
# this file current: after every deploy, restart, or rollback the addresses
# below are stale and clients get 502s while every Datum object reads green
# (register row L8).
#
# Do not hand-edit the addresses — run:
#   deploy/datum/scripts/repoint-ingress.sh
#
# The address below is TEST-NET-3 (RFC 5737) documentation space: a deliberate
# placeholder so an unrefreshed slice fails loudly instead of half-working.
# Every port needs a name, or the operator refuses the slice.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ronggur-my-id-endpoints
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    appProtocol: http
    port: 8080
endpoints:
  - addresses:
      - 203.0.113.1
