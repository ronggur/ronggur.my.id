# The edge Gateway. Its status carries the canonical hostname — two words plus
# five characters under datumproxy.net, derived from the Gateway's UID, so it
# cannot be predicted before create. Read it with:
#   kubectl get gateway ronggur-my-id-gw -o jsonpath='{.status.addresses[0].value}'
#
# The webhook permits ports 80/443 only, TLS mode Terminate, and forbids
# certificateRefs — certificates are issued for you (register row L18).
# Apply with kubectl, not datumctl compute: this Kind is outside the plugin.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ronggur-my-id-gw
spec:
  gatewayClassName: datum-external-global-proxy
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        options:
          gateway.networking.datumapis.com/certificate-issuer: auto
      allowedRoutes:
        namespaces:
          from: Same
