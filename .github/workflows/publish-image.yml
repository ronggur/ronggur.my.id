# Bangun image dan push ke ghcr.io. Workflow ini TIDAK men-deploy apa pun ke
# Datum — deploy tetap manual dari terminal, lihat deploy-manual.md.
#
# Dua mode, dipilih saat menjalankan:
#
#   rootfs (default)  Build ./Dockerfile.unikraft sebagai Docker image biasa
#                     dan push ke ghcr.io. TIDAK butuh secret apa pun —
#                     GITHUB_TOKEN bawaan sudah cukup berkat `packages: write`.
#                     Hasilnya BUKAN unikernel: image ini tidak akan boot di
#                     cell Datum. Gunanya membuktikan rantai registry —
#                     push, visibility, dan pull anonim — selagi akses base
#                     image Unikraft belum ada.
#
#   unikernel         Build unikernel sungguhan dengan kraft. Butuh secret
#                     KRAFT_USER dan KRAFT_TOKEN (kredensial index.unikraft.io);
#                     runtime base-compat hanya bisa ditarik akun yang punya
#                     akses (limits register L51). Tanpa itu langkahnya berhenti
#                     di "could not find runtime".
#
# Sengaja hanya workflow_dispatch: tidak pernah jalan sendiri saat push.
name: publish-image

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Apa yang dibangun"
        type: choice
        default: rootfs
        options:
          - rootfs
          - unikernel
      tag:
        description: "Tag image (default: mode + commit SHA pendek)"
        required: false
        type: string

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ronggur-my-id

jobs:
  rootfs:
    if: inputs.mode == 'rootfs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Login ke ghcr.io
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build dan push
        id: build
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="rootfs-${GITHUB_SHA::7}"
          docker buildx build \
            --platform linux/amd64 \
            -f Dockerfile.unikraft \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=$GITHUB_SHA \
            --label org.opencontainers.image.description="Rootfs image (plain Docker image, not a unikernel)" \
            -t "$IMAGE:$TAG" \
            --push .
          echo "ref=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

      - name: Laporkan digest
        run: |
          REF='${{ steps.build.outputs.ref }}'
          DIGEST="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')"
          {
            echo "### Image ter-push"
            echo ""
            echo '```'
            echo "$REF"
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo ""
            echo "**Ini Docker image biasa, bukan unikernel** — tidak akan boot di cell Datum."
            echo "Langkah berikutnya: pastikan package-nya publik, lalu buktikan bisa ditarik anonim:"
            echo ""
            echo '```sh'
            echo "docker logout ghcr.io && crane manifest $IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  unikernel:
    if: inputs.mode == 'unikernel'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Pasang toolchain
        run: brew install kraftkit crane

      - name: Login ke registry
        env:
          KRAFT_USER: ${{ secrets.KRAFT_USER }}
          KRAFT_TOKEN: ${{ secrets.KRAFT_TOKEN }}
        run: |
          [ -n "$KRAFT_TOKEN" ] || { echo "::error::secret KRAFT_TOKEN belum diisi — lihat komentar di atas file ini"; exit 1; }
          kraft login --user "$KRAFT_USER" --token "$KRAFT_TOKEN" index.unikraft.io
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          crane auth login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - name: Build dan push unikernel
        id: build
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_SHA::7}"
          kraft pkg --name "$IMAGE:$TAG" --plat kraftcloud --arch x86_64 --push .
          echo "ref=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

      - name: Laporkan digest untuk di-pin manual
        run: |
          REF='${{ steps.build.outputs.ref }}'
          DIGEST="$(crane digest "$REF")"
          crane manifest "$REF" | jq -c '.manifests // [] | map(.platform)'
          {
            echo "### Unikernel siap di-deploy"
            echo ""
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo ""
            echo "Pin baris \`image:\` di workload.yaml ke referensi di atas, lalu jalankan"
            echo "\`datumctl compute deploy -f workload.yaml\` dari terminal."
          } >> "$GITHUB_STEP_SUMMARY"
